<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlobTune — an educational Melodyne-style pitch editor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%23f0a04b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◍</span>
      <span class="title">BlobTune</span>
      <span class="subtitle">educational pitch &amp; time editor</span>
    </div>

    <div class="transport">
      <button id="btn-play" class="tbtn" title="Play / Pause (Space)">▶</button>
      <button id="btn-stop" class="tbtn" title="Stop">■</button>
      <span class="time-readout" id="time-readout">0:00.0 / 0:00.0</span>
    </div>

    <div class="tools">
      <label class="filebtn">
        Load audio
        <input type="file" id="file-input" accept="audio/*" hidden>
      </label>
      <button id="btn-record" class="tbtn wide" title="Record from your microphone">● Record</button>
      <div id="level-meter" class="level-meter hidden" title="Input level" aria-hidden="true">
        <div id="level-fill" class="level-fill"></div>
      </div>
      <button id="btn-demo" class="tbtn wide" title="Generate a built-in demo melody">Demo tone</button>
      <button id="btn-undo" class="tbtn" title="Undo pitch edit (Ctrl/⌘+Z)" disabled>↶ Undo</button>
      <button id="btn-redo" class="tbtn" title="Redo pitch edit (Ctrl/⌘+Shift+Z)" disabled>↷ Redo</button>
      <button id="btn-reset" class="tbtn" title="Reset all pitch edits">Reset edits</button>
      <label class="filebtn ghost" title="Import a MIDI file as blobs">
        Import MIDI
        <input type="file" id="midi-input" accept=".mid,.midi,audio/midi" hidden>
      </label>
      <button id="btn-export" class="tbtn wide" title="Export the edited audio as a WAV file">⭳ Export WAV</button>
      <button id="btn-export-midi" class="tbtn wide" title="Export the edited notes as a MIDI file">⭳ Export MIDI</button>
    </div>

    <div class="zoom">
      <span class="zlabel">Zoom</span>
      <button id="zoom-out" class="tbtn">−</button>
      <button id="zoom-in" class="tbtn">+</button>
    </div>
  </header>

  <div id="drop-hint" class="drop-hint hidden">Drop an audio file to analyze</div>

  <main class="workspace">
    <div class="editor-wrap" id="editor-wrap">
      <canvas id="piano-roll"></canvas>
    </div>
    <div class="statusbar">
      <span id="status-text">Load an audio file or click “Demo tone” to begin.</span>
      <span id="selection-text"></span>
    </div>
  </main>

  <div id="loading" class="loading hidden"><div class="spinner"></div><span id="loading-text">Analyzing…</span></div>

  <!-- Modules loaded in dependency order; no build step, no external deps -->
  <script src="js/pitch.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/midi.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
